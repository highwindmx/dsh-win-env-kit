# dsh-win-env-kit bundle patch: mount the win-env-kit skill provider into
# the host skill registry (its rows are host-plane, so every agent preset's
# scope chain merges the skills it registers).
#
# This patch is applied over the dsh-base layer; later layers (the profile's
# own cordis.patch.yml and --patch overlays) can still address this row by id.
#
# `config` here is the composition base layer. To keep some rules off, add a
# patch row to your profile's own cordis.patch.yml: a mapping with an `id` and
# no `insert` targets that existing row. A config is replaced wholesale, never
# deep-merged, so restate every field you want to keep — the full-on baseline
# below is spelled out for exactly that reason.
#
#   - id: win-env-kit
#     config:
#       enabledRules: []
#       rule1: true
#       rule2: true
#       rule3: false        # no distributable binaries here
#       rule4: false        # ... and no SmartScreen reputation work
#       rule5: true
#       rule6: true
#       rule7: true
#       rule8: true
#       rule9: true
#
# Or name exactly the rules to keep, which wins over the per-rule switches:
#
#   - id: win-env-kit
#     config:
#       enabledRules: [1, 2, 5, 7, 8]
#       # ruleN may be omitted here: enabledRules decides, and an omitted
#       # field takes its schema default.
- insert:
    - id: win-env-kit
      name: 'dsh-win-env-kit'
      config:
        enabledRules: []
        rule1: true
        rule2: true
        rule3: true
        rule4: true
        rule5: true
        rule6: true
        rule7: true
        rule8: true
        rule9: true
